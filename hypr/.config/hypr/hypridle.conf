# ==========================================
#  HYPRIDLE — what happens while you're away
#   5 min  — the screen smoothly dims
#   10 min — lock screen
#   30 min — sleep
#  Video and calls (Firefox, mpv, Telegram) inhibit idle by themselves.
# ==========================================

general {
    lock_cmd         = ~/.config/hypr/scripts/lock.sh      # Quickshell, hyprlock as a fallback
    before_sleep_cmd = loginctl lock-session      # lock before sleep (and when the lid closes)
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 5 min — smoothly dim the screen (any input restores brightness)
listener {
    timeout    = 300
    on-timeout = ~/.config/hypr/scripts/dim.sh on
    on-resume  = ~/.config/hypr/scripts/dim.sh off
}

# 10 min — lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 30 min — sleep
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
