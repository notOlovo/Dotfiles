# ==========================================
#  HYPRLOCK — "quiet deep space" (fallback lock screen)
#  Colors and texts: colors.conf
# ==========================================

source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier  = drift, 0.16, 1.00, 0.30, 1.00
    animation = fadeIn,  1, 5, drift
    animation = fadeOut, 1, 5, drift
}

# A blurred screenshot sunk into darkness
background {
    monitor     =
    path        = screenshot
    color       = $void
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.45
    vibrancy    = 0.15
    noise       = 0.02
}

# Clock
label {
    monitor     =
    text        = $TIME
    font_size   = 96
    font_family = $font ExtraBold
    color       = $bright
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = $blue_glow
    position    = 0, 160
    halign      = center
    valign      = center
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_size   = 16
    font_family = $font
    color       = $subtle
    position    = 0, 70
    halign      = center
    valign      = center
}

# Password field
input-field {
    monitor  =
    size     = 300, 46
    rounding = 8
    outline_thickness = 1

    outer_color = $blue_a $violet_a 45deg
    inner_color = $base_cc
    font_color  = $text
    check_color = $cyan
    fail_color  = $rose

    font_family       = $font
    placeholder_text  = <span foreground="##$muted_hex">$txt_password</span>
    fail_text         = <span foreground="##$rose_hex">$txt_wrong</span>
    dots_size     = 0.22
    dots_spacing  = 0.4
    dots_center   = true
    fade_on_empty = false

    position = 0, -40
    halign   = center
    valign   = center
}

# User
label {
    monitor     =
    text        = $USER
    font_size   = 12
    font_family = $font
    color       = $muted
    position    = 0, 40
    halign      = center
    valign      = bottom
}
