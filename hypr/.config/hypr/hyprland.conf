# ==========================================
#  HYPRLAND — "quiet deep space"
#  Theme:  colors.conf
#  Binds:  keybinds.conf
# ==========================================

source = ~/.config/hypr/colors.conf

# ==========================================
# 1. MONITORS
# ==========================================
monitor = , preferred, auto, 1.25

# ==========================================
# 2. PROGRAMS
# ==========================================
$terminal    = kitty
$fileManager = thunar
$menu        = qs ipc -c desktop call popup toggle launcher
$browser     = firefox
$clipboard   = qs ipc -c desktop call popup toggle clipboard
$telegram    = ~/.config/hypr/scripts/telegram.sh
$powermenu   = wlogout -b 5 -T 300 -B 300 -c 12

$mainMod = SUPER

# ==========================================
# 3. ENVIRONMENT
# ==========================================
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1

# XWayland apps render at native resolution,
# without the blur of fractional scale 1.25
xwayland {
    force_zero_scaling = true
}

# ==========================================
# 4. AUTOSTART
# ==========================================
exec-once = ~/.config/waybar/scripts/launch.sh   # restart on crash
exec-once = qs -c desktop          # desktop widgets (Quickshell)
exec-once = swaync
exec-once = waypaper --restore
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = Telegram -startintray   # lives in the tray so notifications arrive
exec-once = ~/.config/hypr/scripts/bt-agent.sh   # confirms Bluetooth pairing
exec-once = udiskie --smart-tray   # automount, tray icon only while a drive is connected

# Clipboard history: separate watchers for text and images
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ==========================================
# 5. LOOK
# ==========================================
general {
    gaps_in     = 4
    gaps_out    = 10
    border_size = 1

    # A cold neon glow on the active window, inactive ones dissolve into the dark
    col.active_border   = $blue_a $violet_a 45deg
    col.inactive_border = $border_in

    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8

    active_opacity   = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled      = true
        range        = 18
        render_power = 3
        color        = $shadow
    }

    blur {
        enabled   = true
        size      = 6
        passes    = 3
        noise     = 0.02
        contrast  = 0.9
        vibrancy  = 0.15
        popups    = true
    }
}

# "Zero gravity" motion: a quick start, a long soft slowdown
animations {
    enabled = yes

    bezier = drift,   0.16, 1.00, 0.30, 1.00    # the main slowdown (easeOutExpo)
    bezier = smooth,  0.23, 1.00, 0.32, 1.00    # easeOutQuint
    bezier = spring,  0.30, 1.18, 0.40, 1.00    # a slight overshoot and return
    bezier = sink,    0.55, 0.00, 0.80, 0.30    # exit: slow → fast
    bezier = linear,  0.00, 0.00, 1.00, 1.00

    # Windows: appear with a spring, disappear sinking inwards
    animation = windowsIn,   1, 4.5, spring, popin 86%
    animation = windowsOut,  1, 2.5, sink,   popin 90%
    animation = windowsMove, 1, 4,   smooth

    animation = fadeIn,      1, 3,   smooth
    animation = fadeOut,     1, 2.5, sink
    animation = fadeSwitch,  1, 4,   smooth
    animation = fadeDim,     1, 5,   smooth
    animation = border,      1, 6,   smooth
    animation = borderangle, 1, 80,  linear, loop

    # Switching workspaces: a slide with a fade
    animation = workspacesIn,  1, 5, drift, slidefade 18%
    animation = workspacesOut, 1, 5, drift, slidefade 18%
    animation = specialWorkspace, 1, 5, drift, slidefadevert -20%

    # Bars and menus (Rofi, wlogout, notifications)
    animation = layersIn,      1, 3.5, smooth, popin 94%
    animation = layersOut,     1, 2,   sink,   fade
    animation = fadeLayersIn,  1, 3,   smooth
    animation = fadeLayersOut, 1, 2,   sink
}

dwindle {
    preserve_split = true
    force_split    = 2   # a new window always goes right/below, not where the cursor is
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
    background_color         = $void

    # If the lock screen crashes it can be restarted instead of rebooting:
    # Ctrl+Alt+F3 → hyprctl --instance 0 dispatch exec ~/.config/hypr/scripts/lock.sh → Ctrl+Alt+F1
    allow_session_lock_restore = true
}

# ==========================================
# 6. KEYBOARD AND MOUSE
# ==========================================
input {
    kb_layout  = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }
}

gesture = 3, horizontal, workspace

# ==========================================
# 7. WINDOW AND LAYER RULES
# ==========================================
# Small utilities from Waybar — floating
# Apps don't maximize themselves (kitty remembered "maximized" and opened
# over the layout) — only I maximize: Win+B / Win+Shift+B
windowrule = suppress_event maximize, match:class .*

windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager|btop)$
windowrule = size 720 480, match:class ^(org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager|btop)$

# Telegram — a dropdown window in its own special workspace (SUPER+G)
windowrule = workspace special:telegram silent, match:class ^(org.telegram.desktop|TelegramDesktop)$
windowrule = float on,                          match:class ^(org.telegram.desktop|TelegramDesktop)$
windowrule = size (monitor_w*0.4) (monitor_h*0.7), match:class ^(org.telegram.desktop|TelegramDesktop)$
windowrule = center on,                         match:class ^(org.telegram.desktop|TelegramDesktop)$

# Blur under the translucent bar and menus
layerrule = blur on, match:namespace ^(waybar|rofi|logout_dialog|swaync-control-center|swaync-notification-window|qs-desktop|qs-desktop-overlay|qs-popup)$
layerrule = ignore_alpha 0.1, match:namespace ^(waybar|rofi|logout_dialog|swaync-control-center|swaync-notification-window|qs-desktop|qs-desktop-overlay|qs-popup)$

# Notifications slide in from the top, Quickshell menus animate themselves (no double animation)
layerrule = animation slide top, match:namespace ^(swaync-notification-window)$
layerrule = no_anim on, match:namespace ^(qs-popup|qs-osd|qs-desktop-overlay|qs-battery)$

# ==========================================
# 8. KEYBINDS
# ==========================================
source = ~/.config/hypr/keybinds.conf
