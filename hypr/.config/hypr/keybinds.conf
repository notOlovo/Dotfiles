# ==========================================
#  KEYBINDS
#  The comment above a group of binds is its description in the Win+/ cheatsheet:
#  "# English | Русский" — the half for the interface language is shown.
#  The "ORIGINAL" section is carried over 1:1 from the old hyprland.conf.
# ==========================================

# ------------------------------------------
# ORIGINAL
# ------------------------------------------

# Main commands | Основные команды
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, A, exec, $menu
bind = $mainMod, B, fullscreen,
bind = $mainMod, F, exec, $browser
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/rotate.sh

# Screenshots | Скриншоты
bind = , Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -

# Move focus between windows (Win + arrows) | Перемещение фокуса между окнами (Win + стрелочки)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize windows (Win + Alt + arrows) | Изменение размера окон (Win + Alt + стрелочки)
binde = $mainMod ALT, right, resizeactive, 20 0
binde = $mainMod ALT, left, resizeactive, -20 0
binde = $mainMod ALT, up, resizeactive, 0 -20
binde = $mainMod ALT, down, resizeactive, 0 20

# Switch workspaces (Win + numbers) | Переключение рабочих столов (Win + цифры)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move the active window to another workspace (Win + Shift + numbers) | Перемещение активного окна на другой рабочий стол (Win + Shift + цифры)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ------------------------------------------
# NEW
# ------------------------------------------

# Clipboard history (text + images). SUPER+V is taken by togglefloating | Буфер обмена (текст + картинки). SUPER+V занят togglefloating.
bind = $mainMod SHIFT, V, exec, $clipboard

# ---------- Window management ----------

# Move window (Win + Shift + arrows): in tiling it swaps with the neighbour | Перемещение окна (Win + Shift + стрелочки): в тайлинге меняется местами с соседом
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Snap to half of the screen (Win + Ctrl + ←/→), maximize (↑), back to tiling (↓) | Прилипание к половине экрана (Win + Ctrl + ←/→), развернуть (↑), вернуть в тайлинг (↓)
bind = $mainMod CTRL, left,  exec, ~/.config/hypr/scripts/snap.sh left
bind = $mainMod CTRL, right, exec, ~/.config/hypr/scripts/snap.sh right
bind = $mainMod CTRL, up,    exec, ~/.config/hypr/scripts/snap.sh max
bind = $mainMod CTRL, down,  exec, ~/.config/hypr/scripts/snap.sh tile

# Rotate the split of two windows: side by side ⇄ stacked | Повернуть разделение пары окон: рядом ⇄ друг над другом
bind = $mainMod, J, layoutmsg, togglesplit

# Maximize, keeping the bar and gaps (B is real fullscreen) | Развернуть окно, оставив панель и зазоры (B — настоящий fullscreen)
bind = $mainMod SHIFT, B, fullscreen, 1

# Floating windows: center / pin on all workspaces | Плавающие окна: по центру / закрепить поверх всех рабочих столов
bind = $mainMod, C, centerwindow,
bind = $mainMod, P, pin,

# Mouse: Win + LMB — move, Win + RMB — resize | Мышь: Win + ЛКМ — двигать, Win + ПКМ — менять размер
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Switching | Переключение
bind = $mainMod, Tab, workspace, previous
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ---------- Apps ----------

# Keybind cheatsheet | Шпаргалка по горячим клавишам
bind = $mainMod, slash, exec, qs ipc -c desktop call popup toggle keys

# Desktop widgets over windows | Виджеты рабочего стола поверх окон
bind = $mainMod, D, exec, qs ipc -c desktop call desktop toggle

# Telegram in a small dropdown window | Telegram в маленьком выпадающем окне
bind = $mainMod, G, exec, $telegram

# Lock the screen | Блокировка экрана
bind = $mainMod, L, exec, loginctl lock-session

# Media keys (with an on-screen indicator) | Мультимедиа-клавиши (с индикатором на экране)
bindel = , XF86AudioRaiseVolume,  exec, ~/.config/hypr/scripts/media.sh volume up
bindel = , XF86AudioLowerVolume,  exec, ~/.config/hypr/scripts/media.sh volume down
bindl  = , XF86AudioMute,         exec, ~/.config/hypr/scripts/media.sh volume mute
bindl  = , XF86AudioMicMute,      exec, ~/.config/hypr/scripts/media.sh mic mute
bindel = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/media.sh brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/media.sh brightness down
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
