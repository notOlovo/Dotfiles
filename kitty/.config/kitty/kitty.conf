# ==========================================
#  KITTY — "quiet deep space"
#  Colors: colors.conf
# ==========================================

include colors.conf

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures cursor
modify_font      cell_height 110%

# --- Window: no borders or decorations ---
hide_window_decorations yes
window_padding_width    14
window_border_width     0
draw_minimal_borders    yes
placement_strategy      center
remember_window_size    no      # don't open maximized like the previous window
confirm_os_window_close 0

# Transparency — Hyprland blurs what's behind the window
background_opacity 0.88
dynamic_background_opacity yes

# --- Cursor ---
cursor_shape              beam
cursor_beam_thickness     1.5
cursor_blink_interval     0.6
cursor_stop_blinking_after 10
cursor_trail              3
cursor_trail_decay        0.1 0.4

# --- Misc ---
scrollback_lines  10000
enable_audio_bell no
visual_bell_duration 0
copy_on_select    no
mouse_hide_wait   2.0
detect_urls       yes

# --- Tabs: a thin line at the bottom ---
tab_bar_edge      bottom
tab_bar_style     separator
tab_separator     "  "
tab_title_template " {index} {title} "
tab_bar_min_tabs  2

# --- Wayland ---
linux_display_server wayland
wayland_titlebar_color background
